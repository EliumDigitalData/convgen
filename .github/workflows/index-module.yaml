name: Index Module

# Notifies the Go checksum database of a newly pushed tag, so that `go get`
# doesn't have to wait for sum.golang.org to discover and fetch the new
# version on its own the first time someone requests it.
on:
  push:
    tags:
      - 'v*'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Request module version from the Go checksum database
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          MODULE="$(go list -m)"
          # sum.golang.org expects the module path escaped per
          # golang.org/x/mod/module.EscapePath: each uppercase letter is
          # replaced with "!" followed by its lowercase form.
          ESCAPED="$(printf '%s' "$MODULE" | sed -E 's/([A-Z])/!\L\1/g')"
          URL="https://sum.golang.org/lookup/${ESCAPED}@${VERSION}"

          echo "Looking up ${MODULE}@${VERSION} ($URL)"

          # The very first lookup for a module/version can be slow: sum.golang.org
          # has to ask proxy.golang.org, which in turn has to fetch the tag from
          # the origin VCS, before either of them has anything cached. Retry with
          # backoff rather than a single short attempt.
          delay=5
          for attempt in $(seq 1 10); do
            code="$(curl -sS -o response.txt -w '%{http_code}' "$URL")"
            if [ "$code" = "200" ]; then
              echo "Indexed ${MODULE}@${VERSION}"
              cat response.txt
              exit 0
            fi
            echo "Attempt ${attempt} got HTTP ${code}, retrying in ${delay}s..."
            cat response.txt
            sleep "$delay"
            delay=$(( delay < 30 ? delay + 5 : 30 ))
          done

          echo "Failed to index ${MODULE}@${VERSION} after 10 attempts" >&2
          exit 1
